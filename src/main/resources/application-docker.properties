# Docker Environment Configuration

# Spring Configuration
spring.main.allow-bean-definition-overriding=true

# HTTP Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# Docker MySQL Datasource
spring.datasource.url=jdbc:mysql://mysql:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&useServerPrepStmts=true&cachePrepStmts=true&rewriteBatchedStatements=true
spring.datasource.username=tradeuser
spring.datasource.password=tradepass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# Docker Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8

# Captcha Configuration - use Redis for distributed storage
captcha.store=redis
captcha.expiration=300
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# JWT Configuration
app.jwtSecret=eoT0kmNYNXKjkCwLD21d5JC+HIHiBTfLjWGjiXHR8Hbl+mxEE681TlM+McWWIJxmgNlxGBqXecEyL8mpsvem2A==
app.jwtExpirationMs=3600000
jwt.secret=eoT0kmNYNXKjkCwLD21d5JC+HIHiBTfLjWGjiXHR8Hbl+mxEE681TlM+McWWIJxmgNlxGBqXecEyL8mpsvem2A==



# Message acknowledgment
# Publisher confirmation

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=sg.edu.nus.iss.c2csectrade.entity

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Disable auto-configuration that causes issues
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration,org.springframework.boot.actuate.autoconfigure.metrics.web.tomcat.TomcatMetricsAutoConfiguration

# Logging
logging.level.sg.edu.nus.iss.c2csectrade=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

