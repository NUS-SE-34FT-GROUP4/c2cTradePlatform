# Staging and production. Same shape as compose.yaml, but it pulls published
# images instead of building, and every credential comes from the environment
# rather than the file.
#
# Both stacks run on one Droplet. STACK prefixes the container names and the
# *_PORT variables move the host ports, so production (STACK=c2csectrade-prod)
# runs beside staging, which keeps the defaults. Volumes and the network are
# separate because each stack is deployed from its own directory, which compose
# uses as the project name.
services:
  mysql:
    image: mysql:8.0
    container_name: ${STACK:-c2csectrade}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_DATABASE: trade
      MYSQL_USER: tradeuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ c2csectrade-network ]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${STACK:-c2csectrade}-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ c2csectrade-network ]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
    container_name: ${STACK:-c2csectrade}-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Staging and production share one 2 GB Droplet, so each Elasticsearch
      # gets 256 MB of heap; the listing index is far smaller than that.
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ c2csectrade-network ]
    restart: unless-stopped

  minio:
    # minio/minio was pulled from Docker Hub; MinIO now gates it behind a paid
    # license (quay.io/minio/aistor/minio). This is the community rebuild that
    # still runs unlicensed with the same server entrypoint and CLI args.
    image: cgr.dev/chainguard/minio:latest
    container_name: ${STACK:-c2csectrade}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    networks: [ c2csectrade-network ]
    restart: unless-stopped

  backend:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER}/c2c-sectrade-backend:${IMAGE_TAG:-latest}
    container_name: ${STACK:-c2csectrade}-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: tradeuser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      # The browser cannot resolve the Docker hostname, so this must be the
      # server's public address, not localhost.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set MINIO_PUBLIC_ENDPOINT}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # The backend has no fallback key, so this must be set or it will not boot.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        # Search must fail open to the SQL catalogue if the index is degraded.
        condition: service_started
      minio:
        condition: service_started
    networks: [ c2csectrade-network ]
    restart: unless-stopped

  frontend:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER}/c2c-sectrade-frontend:${IMAGE_TAG:-latest}
    container_name: ${STACK:-c2csectrade}-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks: [ c2csectrade-network ]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:
  elasticsearch-data:

networks:
  c2csectrade-network:
    driver: bridge
