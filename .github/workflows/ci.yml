name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with coverage
        run: mvn -B test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-test-results
          path: target/surefire-reports/
          if-no-files-found: warn

  frontend-build:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 18
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # vue-cli-service runs ESLint as part of the build, so a lint error fails this step
      - name: Build
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scanning (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory until Sprint 2: the JWT signing secret is still hard-coded in
    # application.properties and is scheduled to move to a GitHub Actions secret.
    # This job is switched to blocking once that migration is complete.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --verbose

  dependency-scan:
    name: Dependency vulnerability scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy against the repository
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker-build:
    name: Docker image build
    needs: [ backend-test, frontend-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t c2c-sectrade-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t c2c-sectrade-frontend:${{ github.sha }} ./frontend

      - name: Scan backend image for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: c2c-sectrade-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: c2c-sectrade-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
