name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push supersedes a pull request's checks, but a run on main may be in the
# middle of a deployment: cancelling it between the migrations and the restart
# left staging half-updated on 14 October. Runs on main therefore queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit and Testcontainers integration tests
        run: mvn -B verify

      - name: Test release evidence tooling
        run: python3 -m unittest discover -s scripts/ci/tests -v

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn

  frontend-build:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 18
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test bargaining UI behaviour
        working-directory: frontend
        run: npm run test:bargain

      - name: Test admin UI behaviour
        working-directory: frontend
        run: npm run test:admin

      - name: Test cart entry points
        working-directory: frontend
        run: npm run test:cart

      - name: Test order times and the held amount
        working-directory: frontend
        run: npm run test:order-time

      - name: Test the chat, favourite and edit entry points
        working-directory: frontend
        run: npm run test:entries

      # vue-cli-service runs ESLint as part of the build, so a lint error fails this step
      - name: Build
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scanning (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep the current advisory policy. A green job is not a clean-scan claim.
    outputs:
      scan_outcome: ${{ steps.gitleaks.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --verbose

  dependency-scan:
    name: Dependency vulnerability scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scan_outcome: ${{ steps.repository_scan.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare scan evidence
        run: mkdir -p .evidence

      - name: Run Trivy against the repository
        id: repository_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          # Gitleaks handles secrets separately. Do not retain code/secret excerpts.
          scanners: vuln
          format: json
          output: .evidence/trivy-repository.json
          skip-dirs: .evidence
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload dependency scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-evidence-${{ github.run_attempt }}
          path: .evidence/trivy-repository.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  docker-build:
    name: Docker image build
    needs: [ backend-test, frontend-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend_scan_outcome: ${{ steps.backend_scan.outcome }}
      frontend_scan_outcome: ${{ steps.frontend_scan.outcome }}
      publish_outcome: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare image evidence
        run: mkdir -p .evidence

      - name: Validate Docker Compose topology
        env:
          JWT_SECRET: ci-validation-secret-ci-validation-secret-ci-validation-secret-ci-validation-secret
          MYSQL_PASSWORD: ci-validation-only
          MINIO_ROOT_PASSWORD: ci-validation-only
          MINIO_PUBLIC_ENDPOINT: http://localhost:9000
          IMAGE_OWNER: nus-se-34ft-group4
        run: |
          docker compose config --quiet
          docker compose -f compose.staging.yaml config --quiet

      - name: Build backend image
        id: backend_build
        run: docker build -t c2c-sectrade-backend:${{ github.sha }} .

      - name: Build frontend image
        id: frontend_build
        run: docker build -t c2c-sectrade-frontend:${{ github.sha }} ./frontend

      - name: Scan backend image for vulnerabilities
        id: backend_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: c2c-sectrade-backend:${{ github.sha }}
          scanners: vuln
          format: json
          output: .evidence/trivy-backend.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image for vulnerabilities
        id: frontend_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: c2c-sectrade-frontend:${{ github.sha }}
          scanners: vuln
          format: json
          output: .evidence/trivy-frontend.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Only main produces images anyone deploys, so push is gated on the branch.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        id: publish
        if: github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for app in backend frontend; do
            docker tag c2c-sectrade-$app:${{ github.sha }} ghcr.io/$OWNER/c2c-sectrade-$app:${{ github.sha }}
            docker tag c2c-sectrade-$app:${{ github.sha }} ghcr.io/$OWNER/c2c-sectrade-$app:latest
            docker push ghcr.io/$OWNER/c2c-sectrade-$app:${{ github.sha }}
            docker push ghcr.io/$OWNER/c2c-sectrade-$app:latest
          done

      - name: Record image identities and published registry digests
        if: always()
        env:
          BACKEND_BUILD: ${{ steps.backend_build.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python3 scripts/ci/release_evidence.py images --directory .evidence \
            --backend-build "$BACKEND_BUILD" --frontend-build "$FRONTEND_BUILD" --publish "$PUBLISH_OUTCOME"

      - name: Upload image and release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-release-evidence-${{ github.run_attempt }}
          path: .evidence/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  deploy-staging:
    name: Deploy to staging
    needs: [ docker-build ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    # Shared with rollback.yml, so a deployment and a rollback never overlap.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # The workflow ships before the server does. Without the host secret the
      # job reports that it was skipped instead of failing every build on main.
      - name: Check staging is configured
        id: configured
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_HOST is not set - skipping deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file to the server
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "compose.staging.yaml,init.sql,scripts/migrations/*.sql"
          target: "~/c2c-sectrade"

      - name: Pull and restart
        id: restart
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Record the tag running now, so a failed smoke test can go back to it.
            # Read it from the container: compose would need every secret just to answer.
            docker inspect --format '{{.Config.Image}}' c2csectrade-backend 2>/dev/null | sed 's/.*://' > .previous-backend || true
            export IMAGE_OWNER="$OWNER"
            export IMAGE_TAG="${{ github.sha }}"
            export MYSQL_PASSWORD='${{ secrets.STAGING_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.STAGING_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='${{ secrets.STAGING_MINIO_PUBLIC_ENDPOINT }}'
            export JWT_SECRET='${{ secrets.STAGING_JWT_SECRET }}'
            docker compose -f compose.staging.yaml pull
            # Existing MySQL volumes do not rerun init.sql. Apply the additive migrations
            # before starting the application version that queries the new tables.
            docker compose -f compose.staging.yaml up -d mysql redis minio
            for attempt in $(seq 1 30); do
              if docker compose -f compose.staging.yaml exec -T mysql sh -c 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade -e "SELECT 1"' >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" = 30 ]; then echo "MySQL did not become ready"; exit 1; fi
              sleep 2
            done
            # Every migration is additive and safe to rerun; apply them all in name order.
            for migration in scripts/migrations/*.sql; do
              echo "Applying $migration"
              docker compose -f compose.staging.yaml exec -T mysql sh -c 'exec mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade' < "$migration"
            done
            docker compose -f compose.staging.yaml up -d

      - name: Smoke test
        id: smoke
        if: steps.configured.outputs.ready == 'true'
        run: |
          healthy=
          for attempt in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.STAGING_HOST }}:8080/actuator/health" | grep -q '"status":"UP"'; then
              healthy=yes
              break
            fi
            sleep 5
          done
          if [ -z "$healthy" ]; then
            echo "Staging did not become healthy within 150s."
            exit 1
          fi
          echo "Staging is up."
          # The image is tagged with the commit, and the application reports that
          # tag back, so the run can show which commit is live instead of assuming.
          VERSION=$(curl -fsS "http://${{ secrets.STAGING_HOST }}:8080/actuator/info" \
            | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::warning::Staging did not report a version, so the live commit is unconfirmed."
          elif [ "$VERSION" != "${{ github.sha }}" ]; then
            echo "Staging reports $VERSION, but this run deployed ${{ github.sha }}."
            exit 1
          else
            echo "Staging is running ${{ github.sha }}." >> "$GITHUB_STEP_SUMMARY"
          fi


      # .live-backend is what rollback.yml reads; deploy-history.log is the audit trail.
      - name: Record the live version
        id: record_live
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/c2c-sectrade
            echo "${{ github.sha }}" > .live-backend
            echo "$(date -u +%FT%TZ) deploy ${{ github.sha }} run=${{ github.run_id }} by=${{ github.actor }}" >> deploy-history.log

      - name: Summary
        if: steps.configured.outputs.ready == 'true'
        run: echo "Staging is live on \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back if the smoke test failed
        id: rollback
        if: failure() && steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade
            export IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=$(cat .previous-backend 2>/dev/null)
            export IMAGE_TAG=${IMAGE_TAG:-latest}
            # compose.staging.yaml requires these, so a rollback without them fails
            # before it touches a container.
            export MYSQL_PASSWORD='${{ secrets.STAGING_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.STAGING_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='${{ secrets.STAGING_MINIO_PUBLIC_ENDPOINT }}'
            export JWT_SECRET='${{ secrets.STAGING_JWT_SECRET }}'
            docker compose -f compose.staging.yaml up -d
            echo "$IMAGE_TAG" > .live-backend
            echo "$(date -u +%FT%TZ) auto-rollback $IMAGE_TAG run=${{ github.run_id }} (smoke test failed for ${{ github.sha }})" >> deploy-history.log
            echo "Rolled back to $IMAGE_TAG"

      - name: Record staging deployment evidence
        if: always()
        env:
          CONFIGURED: ${{ steps.configured.outputs.ready }}
          RESTART: ${{ steps.restart.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          RECORD_LIVE: ${{ steps.record_live.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          python3 scripts/ci/release_evidence.py deployment --directory .evidence \
            --configured "$CONFIGURED" --restart "$RESTART" --smoke "$SMOKE" \
            --record "$RECORD_LIVE" --rollback "$ROLLBACK"

      - name: Upload staging deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-deployment-evidence-${{ github.run_attempt }}
          path: .evidence/staging-deployment.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  # Does not wait for production approval. Captures failure/skips as well as success.
  release-evidence:
    name: Release evidence summary
    needs: [ backend-test, frontend-build, secret-scan, dependency-scan, docker-build, deploy-staging ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download available evidence for this attempt
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: '*-evidence-${{ github.run_attempt }}'
          path: .evidence
          merge-multiple: true

      - name: Summarize actual outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci/release_evidence.py summary --directory .evidence
          cat .evidence/release-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload slide-ready release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: .evidence/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  # Promotes the commit staging just verified. The production environment
  # requires a reviewer, so this job waits for a manual approval. Production
  # shares the staging Droplet: it runs as a second stack (STACK, *_PORT) from
  # its own directory, with its own database, MinIO and JWT secrets.
  deploy-production:
    name: Deploy to production
    needs: [ deploy-staging ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      STACK: c2csectrade-prod
      API_PORT: "8081"
      HTTP_PORT: "8088"
      MINIO_PORT: "9002"
    steps:
      - uses: actions/checkout@v7

      - name: Check production is configured
        id: configured
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ] || [ -z "${{ secrets.PROD_JWT_SECRET }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production secrets are not set - skipping deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file to the server
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "compose.staging.yaml,init.sql,scripts/migrations/*.sql"
          target: "~/c2c-sectrade-prod"

      - name: Pull and restart
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade-prod
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker inspect --format '{{.Config.Image}}' ${{ env.STACK }}-backend 2>/dev/null | sed 's/.*://' > .previous-backend || true
            export STACK='${{ env.STACK }}' API_PORT='${{ env.API_PORT }}' HTTP_PORT='${{ env.HTTP_PORT }}' MINIO_PORT='${{ env.MINIO_PORT }}'
            export IMAGE_OWNER="$OWNER"
            export IMAGE_TAG="${{ github.sha }}"
            export MYSQL_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.PROD_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='http://${{ secrets.STAGING_HOST }}:${{ env.MINIO_PORT }}'
            export JWT_SECRET='${{ secrets.PROD_JWT_SECRET }}'
            docker compose -f compose.staging.yaml pull
            docker compose -f compose.staging.yaml up -d mysql redis minio
            for attempt in $(seq 1 30); do
              if docker compose -f compose.staging.yaml exec -T mysql sh -c 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade -e "SELECT 1"' >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" = 30 ]; then echo "MySQL did not become ready"; exit 1; fi
              sleep 2
            done
            # Every migration is additive and safe to rerun; apply them all in name order.
            for migration in scripts/migrations/*.sql; do
              echo "Applying $migration"
              docker compose -f compose.staging.yaml exec -T mysql sh -c 'exec mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade' < "$migration"
            done
            docker compose -f compose.staging.yaml up -d

      - name: Smoke test
        if: steps.configured.outputs.ready == 'true'
        run: |
          healthy=
          for attempt in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.STAGING_HOST }}:${{ env.API_PORT }}/actuator/health" | grep -q '"status":"UP"'; then
              healthy=yes
              break
            fi
            sleep 5
          done
          if [ -z "$healthy" ]; then
            echo "Production did not become healthy within 150s."
            exit 1
          fi
          echo "Production is up."
          # The image is tagged with the commit, and the application reports that
          # tag back, so the run can show which commit is live instead of assuming.
          VERSION=$(curl -fsS "http://${{ secrets.STAGING_HOST }}:${{ env.API_PORT }}/actuator/info" \
            | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::warning::Production did not report a version, so the live commit is unconfirmed."
          elif [ "$VERSION" != "${{ github.sha }}" ]; then
            echo "Production reports $VERSION, but this run deployed ${{ github.sha }}."
            exit 1
          else
            echo "Production is running ${{ github.sha }}." >> "$GITHUB_STEP_SUMMARY"
          fi


      - name: Record the live version
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/c2c-sectrade-prod
            echo "${{ github.sha }}" > .live-backend
            echo "$(date -u +%FT%TZ) deploy ${{ github.sha }} run=${{ github.run_id }} by=${{ github.actor }}" >> deploy-history.log

      - name: Summary
        if: steps.configured.outputs.ready == 'true'
        run: echo "Production is live on \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back if the smoke test failed
        if: failure() && steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade-prod
            export STACK='${{ env.STACK }}' API_PORT='${{ env.API_PORT }}' HTTP_PORT='${{ env.HTTP_PORT }}' MINIO_PORT='${{ env.MINIO_PORT }}'
            export IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=$(cat .previous-backend 2>/dev/null)
            export IMAGE_TAG=${IMAGE_TAG:-latest}
            export MYSQL_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.PROD_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='http://${{ secrets.STAGING_HOST }}:${{ env.MINIO_PORT }}'
            export JWT_SECRET='${{ secrets.PROD_JWT_SECRET }}'
            docker compose -f compose.staging.yaml up -d
            echo "$IMAGE_TAG" > .live-backend
            echo "$(date -u +%FT%TZ) auto-rollback $IMAGE_TAG run=${{ github.run_id }} (smoke test failed for ${{ github.sha }})" >> deploy-history.log
            echo "Rolled back to $IMAGE_TAG"
