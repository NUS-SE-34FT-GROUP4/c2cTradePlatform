name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit and Testcontainers integration tests
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn

  frontend-build:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 18
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # vue-cli-service runs ESLint as part of the build, so a lint error fails this step
      - name: Build
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scanning (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory until Sprint 2: the JWT signing secret is still hard-coded in
    # application.properties and is scheduled to move to a GitHub Actions secret.
    # This job is switched to blocking once that migration is complete.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --verbose

  dependency-scan:
    name: Dependency vulnerability scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy against the repository
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker-build:
    name: Docker image build
    needs: [ backend-test, frontend-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker Compose topology
        env:
          JWT_SECRET: ci-validation-secret-ci-validation-secret-ci-validation-secret-ci-validation-secret
          MYSQL_PASSWORD: ci-validation-only
          MINIO_ROOT_PASSWORD: ci-validation-only
          MINIO_PUBLIC_ENDPOINT: http://localhost:9000
          IMAGE_OWNER: nus-se-34ft-group4
        run: |
          docker compose config --quiet
          docker compose -f compose.staging.yaml config --quiet

      - name: Build backend image
        run: docker build -t c2c-sectrade-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t c2c-sectrade-frontend:${{ github.sha }} ./frontend

      - name: Scan backend image for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: c2c-sectrade-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: c2c-sectrade-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Only main produces images anyone deploys, so push is gated on the branch.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for app in backend frontend; do
            docker tag c2c-sectrade-$app:${{ github.sha }} ghcr.io/$OWNER/c2c-sectrade-$app:${{ github.sha }}
            docker tag c2c-sectrade-$app:${{ github.sha }} ghcr.io/$OWNER/c2c-sectrade-$app:latest
            docker push ghcr.io/$OWNER/c2c-sectrade-$app:${{ github.sha }}
            docker push ghcr.io/$OWNER/c2c-sectrade-$app:latest
          done

  deploy-staging:
    name: Deploy to staging
    needs: [ docker-build ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # The workflow ships before the server does. Without the host secret the
      # job reports that it was skipped instead of failing every build on main.
      - name: Check staging is configured
        id: configured
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_HOST is not set - skipping deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file to the server
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "compose.staging.yaml,init.sql,scripts/migrations/003_reviews.sql"
          target: "~/c2c-sectrade"

      - name: Pull and restart
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Record the tag running now, so a failed smoke test can go back to it.
            # Read it from the container: compose would need every secret just to answer.
            docker inspect --format '{{.Config.Image}}' c2csectrade-backend 2>/dev/null | sed 's/.*://' > .previous-backend || true
            export IMAGE_OWNER="$OWNER"
            export IMAGE_TAG="${{ github.sha }}"
            export MYSQL_PASSWORD='${{ secrets.STAGING_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.STAGING_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='${{ secrets.STAGING_MINIO_PUBLIC_ENDPOINT }}'
            export JWT_SECRET='${{ secrets.STAGING_JWT_SECRET }}'
            docker compose -f compose.staging.yaml pull
            # Existing MySQL volumes do not rerun init.sql. Apply the additive review migration
            # before starting the application version that queries the new table.
            docker compose -f compose.staging.yaml up -d mysql redis minio
            for attempt in $(seq 1 30); do
              if docker compose -f compose.staging.yaml exec -T mysql sh -c 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade -e "SELECT 1"' >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" = 30 ]; then echo "MySQL did not become ready"; exit 1; fi
              sleep 2
            done
            docker compose -f compose.staging.yaml exec -T mysql sh -c 'exec mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade' < scripts/migrations/003_reviews.sql
            docker compose -f compose.staging.yaml up -d

      - name: Smoke test
        if: steps.configured.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.STAGING_HOST }}:8080/actuator/health" | grep -q '"status":"UP"'; then
              echo "Staging is up."
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not become healthy within 150s."
          exit 1

      - name: Roll back if the smoke test failed
        if: failure() && steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade
            export IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=$(cat .previous-backend 2>/dev/null)
            export IMAGE_TAG=${IMAGE_TAG:-latest}
            # compose.staging.yaml requires these, so a rollback without them fails
            # before it touches a container.
            export MYSQL_PASSWORD='${{ secrets.STAGING_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.STAGING_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='${{ secrets.STAGING_MINIO_PUBLIC_ENDPOINT }}'
            export JWT_SECRET='${{ secrets.STAGING_JWT_SECRET }}'
            docker compose -f compose.staging.yaml up -d
            echo "Rolled back to $IMAGE_TAG"

  # Promotes the commit staging just verified. The production environment
  # requires a reviewer, so this job waits for a manual approval. Production
  # shares the staging Droplet: it runs as a second stack (STACK, *_PORT) from
  # its own directory, with its own database, MinIO and JWT secrets.
  deploy-production:
    name: Deploy to production
    needs: [ deploy-staging ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      STACK: c2csectrade-prod
      API_PORT: "8081"
      HTTP_PORT: "8088"
      MINIO_PORT: "9002"
    steps:
      - uses: actions/checkout@v7

      - name: Check production is configured
        id: configured
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ] || [ -z "${{ secrets.PROD_JWT_SECRET }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production secrets are not set - skipping deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file to the server
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "compose.staging.yaml,init.sql,scripts/migrations/003_reviews.sql"
          target: "~/c2c-sectrade-prod"

      - name: Pull and restart
        if: steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade-prod
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker inspect --format '{{.Config.Image}}' ${{ env.STACK }}-backend 2>/dev/null | sed 's/.*://' > .previous-backend || true
            export STACK='${{ env.STACK }}' API_PORT='${{ env.API_PORT }}' HTTP_PORT='${{ env.HTTP_PORT }}' MINIO_PORT='${{ env.MINIO_PORT }}'
            export IMAGE_OWNER="$OWNER"
            export IMAGE_TAG="${{ github.sha }}"
            export MYSQL_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.PROD_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='http://${{ secrets.STAGING_HOST }}:${{ env.MINIO_PORT }}'
            export JWT_SECRET='${{ secrets.PROD_JWT_SECRET }}'
            docker compose -f compose.staging.yaml pull
            docker compose -f compose.staging.yaml up -d mysql redis minio
            for attempt in $(seq 1 30); do
              if docker compose -f compose.staging.yaml exec -T mysql sh -c 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade -e "SELECT 1"' >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" = 30 ]; then echo "MySQL did not become ready"; exit 1; fi
              sleep 2
            done
            docker compose -f compose.staging.yaml exec -T mysql sh -c 'exec mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" trade' < scripts/migrations/003_reviews.sql
            docker compose -f compose.staging.yaml up -d

      - name: Smoke test
        if: steps.configured.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.STAGING_HOST }}:${{ env.API_PORT }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Production is up."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become healthy within 150s."
          exit 1

      - name: Roll back if the smoke test failed
        if: failure() && steps.configured.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/c2c-sectrade-prod
            export STACK='${{ env.STACK }}' API_PORT='${{ env.API_PORT }}' HTTP_PORT='${{ env.HTTP_PORT }}' MINIO_PORT='${{ env.MINIO_PORT }}'
            export IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=$(cat .previous-backend 2>/dev/null)
            export IMAGE_TAG=${IMAGE_TAG:-latest}
            export MYSQL_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}'
            export MINIO_ROOT_PASSWORD='${{ secrets.PROD_MINIO_PASSWORD }}'
            export MINIO_PUBLIC_ENDPOINT='http://${{ secrets.STAGING_HOST }}:${{ env.MINIO_PORT }}'
            export JWT_SECRET='${{ secrets.PROD_JWT_SECRET }}'
            docker compose -f compose.staging.yaml up -d
            echo "Rolled back to $IMAGE_TAG"
